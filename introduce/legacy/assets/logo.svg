<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="logoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Emerald-Cyan Accent Gradient -->
    <linearGradient id="logoAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#logoBgGrad)" stroke="url(#logoBorderGrad)" stroke-width="4"/>

  <!-- Subtle Radial Inner Glow -->
  <circle cx="256" cy="256" r="180" fill="#22c55e" fill-opacity="0.05" filter="url(#logoGlow)"/>

  <!-- Orbital Track (Account Rotation Orbit) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 8" opacity="0.6"/>
  <path d="M 416 256 A 160 160 0 0 1 143 369" fill="none" stroke="url(#logoAccentGrad)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Orbit Arrow Head -->
  <polygon points="135,360 148,375 130,378" fill="#22c55e"/>

  <path d="M 96 256 A 160 160 0 0 1 369 143" fill="none" stroke="url(#logoAccentGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Orbit Arrow Head 2 -->
  <polygon points="377,152 364,137 382,134" fill="#38bdf8"/>

  <!-- Orbiting Account Nodes -->
  <!-- Node 1: Active (Emerald) -->
  <g filter="url(#logoGlow)">
    <circle cx="416" cy="256" r="18" fill="#22c55e"/>
    <circle cx="416" cy="256" r="10" fill="#ffffff"/>
  </g>
  <!-- Node 2: Ready (Cyan) -->
  <g filter="url(#logoGlow)">
    <circle cx="96" cy="256" r="16" fill="#38bdf8"/>
    <circle cx="96" cy="256" r="8" fill="#ffffff"/>
  </g>
  <!-- Node 3: Standby (Purple) -->
  <circle cx="256" cy="96" r="12" fill="#c084fc"/>
  <!-- Node 4: Cooldown (Amber) -->
  <circle cx="256" cy="416" r="10" fill="#f59e0b" opacity="0.8"/>

  <!-- Central Terminal Container -->
  <rect x="136" y="136" width="240" height="240" rx="48" fill="#0d121f" stroke="#1e293b" stroke-width="4"/>
  <rect x="138" y="138" width="236" height="236" rx="46" fill="none" stroke="url(#logoAccentGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Terminal Content: Chevron and Prompt Line -->
  <path d="M 196 196 L 244 244 L 196 292" fill="none" stroke="url(#logoAccentGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)"/>
  <line x1="264" y1="292" x2="316" y2="292" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>

  <!-- Tiny Status Indicator -->
  <circle cx="340" cy="168" r="6" fill="#22c55e"/>
</svg>
