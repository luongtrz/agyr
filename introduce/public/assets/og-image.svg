<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="ogBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0d121f"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="ogCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Emerald Cyan Text Gradient -->
    <linearGradient id="ogEmeraldCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Amber Red Gradient -->
    <linearGradient id="ogAmberRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="ogBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
    <filter id="glowBadge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .og-font {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .og-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#ogBgGrad)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="120" r="280" fill="#22c55e" fill-opacity="0.12" filter="url(#glowSubtle)"/>
  <circle cx="1050" cy="500" r="320" fill="#38bdf8" fill-opacity="0.10" filter="url(#glowSubtle)"/>
  <circle cx="700" cy="180" r="260" fill="#a855f7" fill-opacity="0.06" filter="url(#glowSubtle)"/>

  <!-- Subtle High-Tech Grid Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Left Content Area -->
  <!-- Brand Logo & Pill -->
  <g transform="translate(80, 75)">
    <!-- Mini Logo Icon -->
    <rect x="0" y="0" width="46" height="46" rx="12" fill="#0e1726" stroke="#22c55e" stroke-width="2"/>
    <path d="M 12 17 L 22 23 L 12 29" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="24" y1="29" x2="34" y2="29" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 32 15 A 8 8 0 0 1 34 23" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Brand Name -->
    <text x="60" y="34" class="og-font" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5px">agyr</text>

    <!-- Version Badge -->
    <rect x="146" y="11" width="84" height="24" rx="12" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1"/>
    <text x="188" y="27" class="og-font" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle" letter-spacing="0.5px">v1.5 • OSS</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 195)">
    <text x="0" y="0" class="og-font" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1px">
      Never hit a <tspan fill="url(#ogAmberRed)">429 quota</tspan>
    </text>
    <text x="0" y="56" class="og-font" font-size="46" font-weight="800" fill="url(#ogEmeraldCyan)" letter-spacing="-1px">
      wall again.
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80, 290)">
    <text x="0" y="0" class="og-font" font-size="19" font-weight="400" fill="#94a3b8">
      Zero-Ban Google Account Auto-Rotation for Antigravity CLI.
    </text>
    <text x="0" y="26" class="og-font" font-size="17" font-weight="400" fill="#64748b">
      100% local privacy, authentic client TLS, and instant session resume.
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(80, 365)">
    <!-- Pill 1 -->
    <g>
      <rect x="0" y="0" width="156" height="32" rx="8" fill="rgba(16, 24, 39, 0.8)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#22c55e"/>
      <text x="28" y="21" class="og-font" font-size="12" font-weight="600" fill="#e2e8f0">100% Local Privacy</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(166, 0)">
      <rect x="0" y="0" width="136" height="32" rx="8" fill="rgba(16, 24, 39, 0.8)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#38bdf8"/>
      <text x="28" y="21" class="og-font" font-size="12" font-weight="600" fill="#e2e8f0">Zero Ban Risk</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(312, 0)">
      <rect x="0" y="0" width="160" height="32" rx="8" fill="rgba(16, 24, 39, 0.8)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#c084fc"/>
      <text x="28" y="21" class="og-font" font-size="12" font-weight="600" fill="#e2e8f0">Context Handover</text>
    </g>
  </g>

  <!-- Install Snippet Box -->
  <g transform="translate(80, 440)">
    <rect x="0" y="0" width="510" height="54" rx="10" fill="#090d16" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
    <text x="20" y="33" class="og-mono" font-size="15" fill="#38bdf8" font-weight="700">$</text>
    <text x="36" y="33" class="og-mono" font-size="13.5" fill="#f8fafc">
      curl -fsSL <tspan fill="#34d399">https://agyr.luongtrz.id.vn/install.sh</tspan> | bash
    </text>
    <rect x="424" y="10" width="72" height="34" rx="6" fill="#1e293b"/>
    <text x="460" y="32" class="og-font" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Install</text>
  </g>

  <!-- Sub-footer Author / GitHub -->
  <g transform="translate(80, 545)">
    <text x="0" y="0" class="og-font" font-size="13" fill="#64748b">
      github.com/luongtrz/rotate-agy • MIT License • Built for Google Antigravity CLI
    </text>
  </g>

  <!-- Right Side: Sleek Dashboard Window Motif -->
  <g transform="translate(630, 85)">
    <!-- Terminal Shadow -->
    <rect x="8" y="8" width="490" height="450" rx="14" fill="#000000" fill-opacity="0.5"/>

    <!-- Terminal Container -->
    <rect x="0" y="0" width="490" height="450" rx="14" fill="url(#ogCardGrad)" stroke="url(#ogBorderGrad)" stroke-width="1.5"/>

    <!-- Terminal Titlebar -->
    <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 476 0 C 483.732 0 490 6.268 490 14 L 490 44 L 0 44 Z" fill="#141c2e"/>
    <line x1="0" y1="44" x2="490" y2="44" stroke="#1f293d" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="22" cy="22" r="5.5" fill="#ef4444"/>
    <circle cx="38" cy="22" r="5.5" fill="#eab308"/>
    <circle cx="54" cy="22" r="5.5" fill="#22c55e"/>

    <!-- Window Title -->
    <text x="245" y="27" class="og-mono" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">agyr list — Quota Dashboard</text>

    <!-- Quota Table inside Window -->
    <!-- Table Header -->
    <g transform="translate(20, 68)">
      <rect x="0" y="0" width="450" height="28" rx="6" fill="#162035"/>
      <text x="14" y="19" class="og-mono" font-size="11" font-weight="700" fill="#94a3b8">ACCOUNT</text>
      <text x="150" y="19" class="og-mono" font-size="11" font-weight="700" fill="#94a3b8">5H QUOTA</text>
      <text x="290" y="19" class="og-mono" font-size="11" font-weight="700" fill="#94a3b8">WEEK</text>
      <text x="375" y="19" class="og-mono" font-size="11" font-weight="700" fill="#94a3b8">STATUS</text>
    </g>

    <!-- Row 1: work-1 (Active, 100%) -->
    <g transform="translate(20, 106)">
      <rect x="0" y="0" width="450" height="54" rx="8" fill="rgba(34, 197, 94, 0.08)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1"/>
      <text x="14" y="32" class="og-mono" font-size="13" font-weight="700" fill="#22c55e">*</text>
      <text x="26" y="32" class="og-mono" font-size="13" font-weight="600" fill="#ffffff">work-1</text>
      <!-- Quota Bar -->
      <g transform="translate(150, 18)">
        <rect x="0" y="0" width="110" height="12" rx="4" fill="#1e293b"/>
        <rect x="0" y="0" width="110" height="12" rx="4" fill="#22c55e"/>
        <text x="0" y="24" class="og-mono" font-size="10" fill="#4ade80" font-weight="700">100% (Ready)</text>
      </g>
      <text x="290" y="32" class="og-mono" font-size="12" fill="#cbd5e1">96%</text>
      <!-- Status Badge -->
      <g transform="translate(370, 18)">
        <rect x="0" y="0" width="68" height="20" rx="4" fill="rgba(34, 197, 94, 0.2)"/>
        <text x="34" y="14" class="og-mono" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">ACTIVE</text>
      </g>
    </g>

    <!-- Row 2: work-2 (Ready, 82%) -->
    <g transform="translate(20, 168)">
      <rect x="0" y="0" width="450" height="50" rx="8" fill="#101726" stroke="#1f293d" stroke-width="1"/>
      <text x="26" y="30" class="og-mono" font-size="13" font-weight="500" fill="#e2e8f0">work-2</text>
      <!-- Quota Bar -->
      <g transform="translate(150, 16)">
        <rect x="0" y="0" width="110" height="12" rx="4" fill="#1e293b"/>
        <rect x="0" y="0" width="90" height="12" rx="4" fill="#22c55e"/>
        <text x="0" y="24" class="og-mono" font-size="10" fill="#94a3b8">82%</text>
      </g>
      <text x="290" y="30" class="og-mono" font-size="12" fill="#cbd5e1">84%</text>
      <!-- Status Badge -->
      <g transform="translate(370, 16)">
        <rect x="0" y="0" width="68" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
        <text x="34" y="14" class="og-mono" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">READY</text>
      </g>
    </g>

    <!-- Row 3: dev-lead (Ready, 55%) -->
    <g transform="translate(20, 226)">
      <rect x="0" y="0" width="450" height="50" rx="8" fill="#101726" stroke="#1f293d" stroke-width="1"/>
      <text x="26" y="30" class="og-mono" font-size="13" font-weight="500" fill="#e2e8f0">dev-lead</text>
      <!-- Quota Bar -->
      <g transform="translate(150, 16)">
        <rect x="0" y="0" width="110" height="12" rx="4" fill="#1e293b"/>
        <rect x="0" y="0" width="60" height="12" rx="4" fill="#eab308"/>
        <text x="0" y="24" class="og-mono" font-size="10" fill="#94a3b8">55%</text>
      </g>
      <text x="290" y="30" class="og-mono" font-size="12" fill="#cbd5e1">71%</text>
      <!-- Status Badge -->
      <g transform="translate(370, 16)">
        <rect x="0" y="0" width="68" height="20" rx="4" fill="rgba(234, 179, 8, 0.15)"/>
        <text x="34" y="14" class="og-mono" font-size="10" font-weight="700" fill="#eab308" text-anchor="middle">STANDBY</text>
      </g>
    </g>

    <!-- Row 4: personal (Cooldown, 0%) -->
    <g transform="translate(20, 284)">
      <rect x="0" y="0" width="450" height="50" rx="8" fill="#101726" stroke="#1f293d" stroke-width="1"/>
      <text x="26" y="30" class="og-mono" font-size="13" font-weight="500" fill="#94a3b8">personal</text>
      <!-- Quota Bar -->
      <g transform="translate(150, 16)">
        <rect x="0" y="0" width="110" height="12" rx="4" fill="#1e293b"/>
        <rect x="0" y="0" width="4" height="12" rx="2" fill="#ef4444"/>
        <text x="0" y="24" class="og-mono" font-size="10" fill="#ef4444">0%</text>
      </g>
      <text x="290" y="30" class="og-mono" font-size="12" fill="#64748b">12%</text>
      <!-- Status Badge -->
      <g transform="translate(370, 16)">
        <rect x="0" y="0" width="68" height="20" rx="4" fill="rgba(239, 68, 68, 0.15)"/>
        <text x="34" y="14" class="og-mono" font-size="9" font-weight="700" fill="#f87171" text-anchor="middle">COOLDOWN</text>
      </g>
    </g>

    <!-- Terminal Footer Status -->
    <g transform="translate(20, 350)">
      <rect x="0" y="0" width="450" height="34" rx="6" fill="#0c111c"/>
      <circle cx="16" cy="17" r="4" fill="#22c55e"/>
      <text x="30" y="21" class="og-mono" font-size="11" fill="#94a3b8">
        Smart Failover: <tspan fill="#4ade80">Auto-selects work-2 on 429</tspan>
      </text>
      <text x="435" y="21" class="og-mono" font-size="11" fill="#64748b" text-anchor="end">4 slots</text>
    </g>

    <!-- Terminal Prompt Line at Bottom -->
    <g transform="translate(25, 412)">
      <text x="0" y="0" class="og-mono" font-size="12" fill="#22c55e">➜</text>
      <text x="18" y="0" class="og-mono" font-size="12" fill="#38bdf8">~</text>
      <text x="32" y="0" class="og-mono" font-size="12" fill="#e2e8f0">agy-run --prompt "Refactor auth middleware"</text>
      <rect x="368" y="-11" width="8" height="14" fill="#38bdf8" opacity="0.8"/>
    </g>
  </g>
</svg>
