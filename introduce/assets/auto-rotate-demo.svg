<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="100%">
  <defs>
    <style>
      .term-bg { fill: #18181b; }
      .titlebar { fill: #202024; }
      .border-line { stroke: #27272a; stroke-width: 1; }
      .term-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 13px;
        letter-spacing: 0px;
        white-space: pre;
      }
      .txt-base { fill: #e4e4e7; }
      .txt-dim { fill: #71717a; }
      .txt-cmd { fill: #f4f4f5; font-weight: 600; }
      .txt-green { fill: #22c55e; font-weight: 600; }
      .txt-yellow { fill: #eab308; font-weight: 600; }
      .txt-red { fill: #ef4444; font-weight: 600; }
      .txt-cyan { fill: #38bdf8; font-weight: 600; }
      .txt-purple { fill: #c084fc; font-weight: 600; }
      .txt-ok { fill: #22c55e; font-weight: 700; }

      @keyframes step1 {
        0%, 3% { opacity: 0; }
        6%, 93% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
      @keyframes step2 {
        0%, 15% { opacity: 0; }
        18%, 93% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
      @keyframes step3 {
        0%, 30% { opacity: 0; }
        33%, 93% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
      @keyframes step4 {
        0%, 45% { opacity: 0; }
        48%, 93% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
      @keyframes step5 {
        0%, 60% { opacity: 0; }
        63%, 93% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
      @keyframes step6 {
        0%, 73% { opacity: 0; }
        76%, 93% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
      @keyframes promptNext {
        0%, 75% { opacity: 0; }
        78%, 93% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .s1 { animation: step1 12s infinite; }
      .s2 { animation: step2 12s infinite; }
      .s3 { animation: step3 12s infinite; }
      .s4 { animation: step4 12s infinite; }
      .s5 { animation: step5 12s infinite; }
      .s6 { animation: step6 12s infinite; }
      .s-next { animation: promptNext 12s infinite; }
      .cursor { animation: cursorBlink 1s infinite; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="0" y="0" width="880" height="300" rx="10" ry="10" class="term-bg border-line" />

  <!-- Window Titlebar -->
  <path d="M0 10C0 4.477 4.477 0 10 0H870C875.52 0 880 4.477 880 10V38H0V10Z" class="titlebar" />
  <line x1="0" y1="38" x2="880" y2="38" stroke="#27272a" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="24" cy="19" r="6" fill="#ef4444" />
  <circle cx="44" cy="19" r="6" fill="#eab308" />
  <circle cx="64" cy="19" r="6" fill="#22c55e" />

  <!-- Window Title -->
  <text x="440" y="24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#a1a1aa" font-weight="500">agy-run — Automatic 429 Quota Failover &amp; Session Resume</text>

  <!-- Terminal Content -->
  <g class="term-text">
    <!-- Initial Prompt -->
    <text x="24" y="68"><tspan class="txt-green">user@devbox</tspan><tspan class="txt-dim">:</tspan><tspan class="txt-cyan">~/projects/auth-svc</tspan><tspan class="txt-dim">$ </tspan><tspan class="txt-cmd">agy-run --add-dir . --prompt "Refactor auth middleware"</tspan></text>

    <!-- Step 1 -->
    <g class="s1">
      <text x="24" y="96"><tspan class="txt-cyan">[agy-run]</tspan><tspan class="txt-base"> running on account </tspan><tspan class="txt-yellow">'work-1'</tspan><tspan class="txt-dim"> (model: gemini-3.8-flash-high)</tspan></text>
    </g>

    <!-- Step 2 -->
    <g class="s2">
      <text x="24" y="122"><tspan class="txt-dim">agy: analyzing codebase and editing middleware.go...</tspan></text>
    </g>

    <!-- Step 3 -->
    <g class="s3">
      <text x="24" y="148"><tspan class="txt-cyan">[agy-run]</tspan><tspan class="txt-red"> 429 quota reached on 'work-1'</tspan><tspan class="txt-yellow"> (Resets in 4h13m20s)</tspan><tspan class="txt-dim"> — killing agy immediately</tspan></text>
    </g>

    <!-- Step 4 -->
    <g class="s4">
      <text x="24" y="174"><tspan class="txt-cyan">[agy-run]</tspan><tspan class="txt-base"> cooldown 'work-1' set to 4h13m20s; switching to </tspan><tspan class="txt-green">'work-2'</tspan><tspan class="txt-dim"> (weekly limit resets soonest)</tspan></text>
    </g>

    <!-- Step 5 -->
    <g class="s5">
      <text x="24" y="200"><tspan class="txt-cyan">[agy-run]</tspan><tspan class="txt-base"> resuming conversation </tspan><tspan class="txt-purple">9c4e1a80-bf82-49da-8b29-9e8c45e69e41</tspan><tspan class="txt-base"> on account </tspan><tspan class="txt-green">'work-2'</tspan></text>
    </g>

    <!-- Step 6 -->
    <g class="s6">
      <text x="24" y="226"><tspan class="txt-cyan">[agy-run]</tspan><tspan class="txt-base"> done (account </tspan><tspan class="txt-green">'work-2'</tspan><tspan class="txt-base">) — </tspan><tspan class="txt-ok">RESULT=OK</tspan></text>
    </g>

    <!-- Returned Prompt with blinking cursor -->
    <g class="s-next">
      <text x="24" y="258"><tspan class="txt-green">user@devbox</tspan><tspan class="txt-dim">:</tspan><tspan class="txt-cyan">~/projects/auth-svc</tspan><tspan class="txt-dim">$ </tspan><tspan class="cursor txt-green">▋</tspan></text>
    </g>
  </g>
</svg>