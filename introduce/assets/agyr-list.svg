    <text x="24" y="250"><tspan class="txt-box">│   </tspan><tspan class="txt-base">backup         </tspan><tspan class="txt-box">│ </tspan><tspan class="txt-green">100%</tspan><tspan class="txt-time">  09/11/2026 05:00 PM </tspan><tspan class="txt-box">│ </tspan><tspan class="txt-green">100%</tspan><tspan class="txt-time">  16/11/2026 12:00 PM </tspan><tspan class="txt-box">│ </tspan><tspan class="txt-green">100%</tspan><tspan class="txt-time">  16/11/2026 12:00 PM </tspan><tspan class="txt-box">│ </tspan><tspan class="txt-green">ready                      </tspan><tspan class="txt-box"> │</tspan></text>

