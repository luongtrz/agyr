<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" width="100%" height="100%">
  <defs>
    <style>
      .term-bg { fill: #18181b; }
      .titlebar { fill: #202024; }
      .border-line { stroke: #27272a; stroke-width: 1; }
      .term-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 13px;
        letter-spacing: 0px;
        white-space: pre;
      }
      .txt-base { fill: #e4e4e7; }
      .txt-dim { fill: #71717a; }
      .txt-hdr { fill: #f4f4f5; font-weight: 600; }
      .txt-box { fill: #52525b; }
      .txt-green { fill: #22c55e; font-weight: 600; }
      .txt-yellow { fill: #eab308; font-weight: 600; }
      .txt-red { fill: #ef4444; font-weight: 600; }
      .txt-cyan { fill: #38bdf8; font-weight: 600; }
      .txt-time { fill: #a1a1aa; }
      .zebra { fill: #24242b; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="0" y="0" width="1060" height="360" rx="10" ry="10" class="term-bg border-line" />

  <!-- Window Titlebar -->
  <path d="M0 10C0 4.477 4.477 0 10 0H1050C1055.52 0 1060 4.477 1060 10V38H0V10Z" class="titlebar" />
  <line x1="0" y1="38" x2="1060" y2="38" stroke="#27272a" stroke-width="1" />

  <!-- Window Buttons -->
