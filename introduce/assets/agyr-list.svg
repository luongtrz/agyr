    <text x="24" y="228"><tspan class="txt-box">│   </tspan><tspan class="txt-base">personal-2     </tspan><tspan class="txt-box">│ </tspan><tspan class="txt-red">  0%</tspan><tspan class="txt-time">  09/11/2026 04:30 PM </tspan><tspan class="txt-box">│ </tspan><tspan class="txt-green"> 75%</tspan><tspan class="txt-time">  16/11/2026 11:00 AM </tspan><tspan class="txt-box">│   </tspan><tspan class="txt-dim">-                      </tspan><tspan class="txt-box">│ </tspan><tspan class="txt-red">cooldown, 3h42m left       </tspan><tspan class="txt-box"> │</tspan></text>

